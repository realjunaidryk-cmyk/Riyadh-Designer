<title>Hostooze Core</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: full-bleed studio stage; the object owns the centre, quiet type pinned to the corners. */
  :root {
    --stage: #E4E5E7;        /* plain light grey studio background */
    --ink: #242424;          /* brand charcoal */
    --ink-soft: #6A6B6F;
    --red: #E24747;          /* brand red */
    --chip: rgba(255, 255, 255, 0.62);
    --hair: rgba(36, 36, 36, 0.12);
    --display: 'Sora', 'Segoe UI', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
    color-scheme: light;
  }
  html, body { height: 100%; }
  [hidden] { display: none !important; }
  body {
    background: var(--stage);
    color: var(--ink);
    font-family: var(--display);
    overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #stage { position: fixed; inset: 0; touch-action: none; }
  #stage canvas { display: block; width: 100%; height: 100%; outline: none; }

  .label {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + 24px);
    left: max(24px, calc(env(safe-area-inset-left, 0px) + 16px));
    right: max(24px, calc(env(safe-area-inset-right, 0px) + 16px));
    display: grid;
    gap: 6px;
    pointer-events: none;
  }
  .label h1 {
    margin: 0;
    font-size: clamp(1.25rem, 1rem + 1vw, 1.6rem);
    font-weight: 600;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  .label h1 span { color: var(--red); }
  .spec {
    margin: 0;
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--ink-soft);
    letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums;
  }
  .swatch { display: inline-block; width: 0.7em; height: 0.7em; border-radius: 2px; vertical-align: -0.05em; margin-right: 0.3em; }

  .controls {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 24px);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    max-width: calc(100% - 32px);
  }
  .seg {
    display: flex;
    padding: 3px;
    border-radius: 999px;
    background: var(--chip);
    border: 1px solid var(--hair);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  button {
    font: 500 0.8125rem/1 var(--display);
    color: var(--ink);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 9px 16px;
    cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  button:hover:not([aria-pressed="true"]) { background: rgba(36, 36, 36, 0.07); }
  button:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

  .status {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    font-family: var(--mono);
    font-size: 0.8125rem;
    color: var(--ink-soft);
    pointer-events: none;
  }
</style>

<div id="stage" aria-label="Interactive 3D view of the Hostooze Core. Drag to orbit, scroll or pinch to zoom."></div>

<div class="label">
  <h1>Hostooze <span>Core</span></h1>
  <p class="spec">2.00 u cube · 12% bevel · 6 identical faces</p>
  <p class="spec"><span class="swatch" style="background:#242424"></span>#242424 &nbsp;<span class="swatch" style="background:#E24747"></span>#E24747</p>
</div>

<div class="controls">
  <div class="seg" role="group" aria-label="Finish">
    <button id="pal-brand" type="button" aria-pressed="true" data-palette="brand">Charcoal</button>
    <button id="pal-light" type="button" aria-pressed="false" data-palette="light">Porcelain</button>
  </div>
  <div class="seg">
    <button id="spin" type="button" aria-pressed="true">Rotating</button>
  </div>
</div>

<div class="status" id="status">Building geometry…</div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
  import { createHostoozeCore } from './hostooze-core.js';

  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const params = new URLSearchParams(location.search);

  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.0;
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color('#E4E5E7');
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.85;

  // soft, even studio lighting
  const key = new THREE.DirectionalLight(0xffffff, 1.3);
  key.position.set(-3, 6, 4);
  const fill = new THREE.DirectionalLight(0xffffff, 0.45);
  fill.position.set(5, 2, 3);
  const rim = new THREE.DirectionalLight(0xffffff, 0.6);
  rim.position.set(0, 3, -6);
  scene.add(key, fill, rim, new THREE.HemisphereLight(0xffffff, 0xd9dadc, 0.35));

  // isometric three-quarter view: three faces visible
  const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 100);
  const dir = new THREE.Vector3(1, 0.86, 1).normalize();
  camera.position.copy(dir.multiplyScalar(9.2));

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.enablePan = false;
  controls.minDistance = 5;
  controls.maxDistance = 16;

  function resize() {
    const w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    // keep the whole cube in frame on tall phone screens
    camera.fov = w < h ? 26 * Math.min(1.7, h / w * 0.85) : 26;
    camera.updateProjectionMatrix();
  }
  addEventListener('resize', resize);
  resize();

  // build on the next frame so the status text paints first
  await new Promise((r) => requestAnimationFrame(() => setTimeout(r, 0)));
  const core = createHostoozeCore({
    res: Number(params.get('res')) || 256,
    palette: params.get('palette') === 'light' ? 'light' : 'brand',
  });
  scene.add(core);
  status.hidden = true;

  const palButtons = document.querySelectorAll('[data-palette]');
  const syncPal = () => palButtons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.palette === core.userData.palette)));
  palButtons.forEach((b) => b.addEventListener('click', () => { core.userData.setPalette(b.dataset.palette); syncPal(); }));
  syncPal();

  const spinBtn = document.getElementById('spin');
  let spinning = !matchMedia('(prefers-reduced-motion: reduce)').matches && params.get('spin') !== '0';
  const syncSpin = () => { spinBtn.setAttribute('aria-pressed', String(spinning)); spinBtn.textContent = spinning ? 'Rotating' : 'Paused'; };
  spinBtn.addEventListener('click', () => { spinning = !spinning; syncSpin(); });
  syncSpin();

  const yaw = Number(params.get('yaw'));
  if (yaw) core.rotation.y = THREE.MathUtils.degToRad(yaw);

  const clock = new THREE.Clock();
  renderer.setAnimationLoop(() => {
    const dt = Math.min(clock.getDelta(), 0.05);
    if (spinning) core.rotation.y += dt * 0.35;
    controls.update();
    renderer.render(scene, camera);
  });

  // hooks for scripted export (see build.mjs)
  window.hostooze = { THREE, core, renderer, ready: true };
</script>
